name: Promote to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD" != "test" ]]; then
            echo "::error::This workflow can only be run from the test branch. Current branch: $HEAD"
            exit 1
          fi
          echo "Promotion path valid: test -> main"

  promote:
    name: Merge, Tag, Release & Deploy
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge test into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/test --no-edit -X theirs

      - name: Push main
        run: git push origin main

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP "Version:\s*\K[0-9.]+" mxroute-mailer.php | head -1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p /tmp/build/mxroute-mailer
          cp -r . /tmp/build/mxroute-mailer/
          rm -rf /tmp/build/mxroute-mailer/.git \
                 /tmp/build/mxroute-mailer/tests \
                 /tmp/build/mxroute-mailer/vendor \
                 /tmp/build/mxroute-mailer/.github \
                 /tmp/build/mxroute-mailer/wiki \
                 /tmp/build/mxroute-mailer/PROMOTION.md \
                 /tmp/build/mxroute-mailer/AGENTS.md \
                 /tmp/build/mxroute-mailer/.gitignore \
                 /tmp/build/mxroute-mailer/composer.* \
                 /tmp/build/mxroute-mailer/phpunit.xml \
                 /tmp/build/mxroute-mailer/phpcs.xml.dist \
                 /tmp/build/mxroute-mailer/.phpunit.result.cache \
                 /tmp/build/mxroute-mailer/*.zip
          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/mxroute-mailer-latest.zip" mxroute-mailer/

      - name: Generate checksum
        if: steps.check.outputs.exists == 'false'
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum "mxroute-mailer-latest.zip" > "mxroute-mailer-latest.zip.sha256"

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: |
            mxroute-mailer-latest.zip
            mxroute-mailer-latest.zip.sha256
          generate_release_notes: true

      - name: Deploy to apt server
        if: steps.check.outputs.exists == 'false'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${APT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key \
            mxroute-mailer-latest.zip \
            "${APT_USER}@${APT_HOST}:/var/www/html/mxroute-mailer/mxroute-mailer-latest.zip"

          ssh -i ~/.ssh/deploy_key "${APT_USER}@${APT_HOST}" \
            "printf '%s' '{\"version\":\"${VERSION}\",\"requires\":{\"php\":\"7.3\",\"wordpress\":\"5.0\"},\"download_url\":\"https://apt.richardkentgates.com/mxroute-mailer/mxroute-mailer-latest.zip\"}' > /var/www/html/mxroute-mailer/metadata.json"

      - name: Validate deployed metadata
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "Waiting for metadata to propagate..."
          sleep 5

          METADATA_URL="https://apt.richardkentgates.com/mxroute-mailer/metadata.json"
          METADATA=$(curl -sf "$METADATA_URL" 2>/dev/null)

          if [ -z "$METADATA" ]; then
            echo "ERROR: Could not fetch metadata.json from $METADATA_URL"
            exit 1
          fi

          ERRORS=""
          VERSION=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version',''))" 2>/dev/null)
          DOWNLOAD=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('download_url',''))" 2>/dev/null)
          PHP_REQ=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('requires',{}).get('php',''))" 2>/dev/null)
          WP_REQ=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('requires',{}).get('wordpress',''))" 2>/dev/null)

          [ -z "$VERSION" ] && ERRORS="${ERRORS}  - missing 'version'\n"
          [ -z "$DOWNLOAD" ] && ERRORS="${ERRORS}  - missing 'download_url'\n"
          [ -z "$PHP_REQ" ] && ERRORS="${ERRORS}  - missing 'requires.php'\n"
          [ -z "$WP_REQ" ] && ERRORS="${ERRORS}  - missing 'requires.wordpress'\n"

          if [ -n "$ERRORS" ]; then
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  FAIL: metadata.json is missing required fields"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            printf "$ERRORS"
            echo ""
            echo "  Current metadata:"
            echo "$METADATA" | python3 -m json.tool 2>/dev/null || echo "$METADATA"
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            exit 1
          fi

          echo "metadata.json is valid: version=${VERSION}, requires.php=${PHP_REQ}, requires.wordpress=${WP_REQ}"

      - name: Summary
        if: steps.check.outputs.exists == 'false'
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Release v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged test → main"
          echo "  ✓ Tagged v${{ steps.version.outputs.version }}"
          echo "  ✓ GitHub release created"
          echo "  ✓ Plugin zip deployed to apt server"
          echo "  ✓ metadata.json validated"
          echo ""
