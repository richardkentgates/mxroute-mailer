name: Promote to Main

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD" != "test" ]]; then
            echo "::error::This workflow can only be run from the test branch. Current branch: $HEAD"
            exit 1
          fi
          echo "Promotion path valid: test -> main"

  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check CI status for the dev tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin dev
          DEV_SHA=$(git rev-parse origin/dev)
          echo "dev HEAD: $DEV_SHA"

          LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
            --workflow "ci.yml" \
            --branch "dev" \
            --limit 1 \
            --json status,conclusion,headSha \
            --jq '.[0]')

          STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
          CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
          HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
          echo "latest dev CI: status=${STATUS} conclusion=${CONCLUSION} head=${HEAD_SHA}"

          # Pin the gate to the exact tree being promoted (accept dev HEAD
          # or its parent). No green pinned run → CAUSE one and wait.
          PARENT_SHA=$(git rev-parse "$DEV_SHA^1" 2>/dev/null || echo none)
          needs_ci=false
          [[ "$STATUS" != "completed" || "$STATUS" == "null" || -z "$STATUS" ]] && needs_ci=true
          if [[ "$HEAD_SHA" != "$DEV_SHA" && "$HEAD_SHA" != "$PARENT_SHA" ]]; then
            needs_ci=true
          fi
          if [[ "$needs_ci" == "true" ]]; then
            echo "No green CI run for the dev tree ($DEV_SHA) — dispatching CI and waiting..."
            gh workflow run "Quality and Security Checks" --ref dev
            for i in $(seq 1 40); do
              sleep 15
              LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
                --workflow "ci.yml" \
                --branch "dev" \
                --limit 1 \
                --json status,conclusion,headSha \
                --jq '.[0]')
              STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
              CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
              HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
              echo "  wait $i: status=${STATUS} head=${HEAD_SHA}"
              if [[ "$STATUS" == "completed" ]] \
                 && { [[ "$HEAD_SHA" == "$DEV_SHA" ]] || [[ "$HEAD_SHA" == "$PARENT_SHA" ]]; }; then
                break
              fi
            done
          fi

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI is still running (status=${STATUS}). Wait for it to complete before promoting."
            exit 1
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI failed (conclusion=${CONCLUSION}). Fix the issues on dev before promoting."
            exit 1
          fi

          if [[ "$HEAD_SHA" != "$DEV_SHA" && "$HEAD_SHA" != "$PARENT_SHA" ]]; then
            echo "::error::Green CI is for a different tree (head=${HEAD_SHA}, dev=${DEV_SHA})."
            exit 1
          fi

          # Promote to Main only ships what test actually contains —
          # dispatching early would ship stale.
          git fetch origin test
          if ! git diff --quiet origin/test origin/dev; then
            echo "::error::test does not contain dev — promote to test first (or wait for it to finish)."
            git diff --stat origin/test origin/dev | head -20
            exit 1
          fi

          echo "CI passed for the promoted tree and test contains dev. Proceeding with promotion."

  promote:
    name: Merge, Tag, Release & Deploy
    runs-on: ubuntu-latest
    needs: [validate, check-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge test into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/test --no-edit -X theirs

      - name: Push main
        run: git push origin main

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP "Version:\s*\K[0-9.]+" mxroute-mailer.php | head -1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p /tmp/build/mxroute-mailer
          cp -r . /tmp/build/mxroute-mailer/
          rm -rf /tmp/build/mxroute-mailer/.git \
                 /tmp/build/mxroute-mailer/tests \
                 /tmp/build/mxroute-mailer/vendor \
                 /tmp/build/mxroute-mailer/.github \
                 /tmp/build/mxroute-mailer/wiki \
                 /tmp/build/mxroute-mailer/PROMOTION.md \
                 /tmp/build/mxroute-mailer/AGENTS.md \
                 /tmp/build/mxroute-mailer/.gitignore \
                 /tmp/build/mxroute-mailer/composer.* \
                 /tmp/build/mxroute-mailer/phpunit.xml \
                 /tmp/build/mxroute-mailer/phpcs.xml.dist \
                 /tmp/build/mxroute-mailer/.phpunit.result.cache \
                 /tmp/build/mxroute-mailer/*.zip
          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/mxroute-mailer-latest.zip" mxroute-mailer/

      - name: Generate checksum
        if: steps.check.outputs.exists == 'false'
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum "mxroute-mailer-latest.zip" > "mxroute-mailer-latest.zip.sha256"

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: |
            mxroute-mailer-latest.zip
            mxroute-mailer-latest.zip.sha256
          generate_release_notes: true

      - name: Deploy to apt server
        if: steps.check.outputs.exists == 'false'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Two connections only (1 scp + 1 ssh) — the apt server rate-limits
          # port 22 and burst deploys trip it. StrictHostKeyChecking=no covers
          # what ssh-keyscan used to do.
          SHA256=$(awk '{print $1}' mxroute-mailer-latest.zip.sha256)

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            mxroute-mailer-latest.zip \
            mxroute-mailer-latest.zip.sha256 \
            "${APT_USER}@${APT_HOST}:/tmp/"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/mxroute-mailer && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/mxroute-mailer && mv /tmp/mxroute-mailer-latest.zip /tmp/mxroute-mailer-latest.zip.sha256 /var/www/html/mxroute-mailer/ && printf '%s' '{\"version\":\"${VERSION}\",\"requires\":{\"php\":\"7.3\",\"wordpress\":\"5.0\"},\"download_url\":\"https://apt.richardkentgates.com/mxroute-mailer/mxroute-mailer-latest.zip\",\"sha256\":\"${SHA256}\"}' > /var/www/html/mxroute-mailer/metadata.json"

      - name: Validate deployed metadata
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "Waiting for metadata to propagate..."
          sleep 5

          METADATA_URL="https://apt.richardkentgates.com/mxroute-mailer/metadata.json"
          METADATA=$(curl -sf "$METADATA_URL" 2>/dev/null)

          if [ -z "$METADATA" ]; then
            echo "ERROR: Could not fetch metadata.json from $METADATA_URL"
            exit 1
          fi

          ERRORS=""
          VERSION=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version',''))" 2>/dev/null)
          DOWNLOAD=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('download_url',''))" 2>/dev/null)
          PHP_REQ=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('requires',{}).get('php',''))" 2>/dev/null)
          WP_REQ=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('requires',{}).get('wordpress',''))" 2>/dev/null)
          SHA=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha256',''))" 2>/dev/null)

          [ -z "$VERSION" ] && ERRORS="${ERRORS}  - missing 'version'\n"
          [ -z "$DOWNLOAD" ] && ERRORS="${ERRORS}  - missing 'download_url'\n"
          [ -z "$PHP_REQ" ] && ERRORS="${ERRORS}  - missing 'requires.php'\n"
          [ -z "$WP_REQ" ] && ERRORS="${ERRORS}  - missing 'requires.wordpress'\n"
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{64}$'; then
            ERRORS="${ERRORS}  - missing or invalid 'sha256'\n"
          fi

          if [ -n "$ERRORS" ]; then
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  FAIL: metadata.json is missing required fields"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            printf "$ERRORS"
            echo ""
            echo "  Current metadata:"
            echo "$METADATA" | python3 -m json.tool 2>/dev/null || echo "$METADATA"
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            exit 1
          fi

          echo "metadata.json is valid: version=${VERSION}, requires.php=${PHP_REQ}, requires.wordpress=${WP_REQ}"

      - name: Summary
        if: steps.check.outputs.exists == 'false'
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Release v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged test → main"
          echo "  ✓ Tagged v${{ steps.version.outputs.version }}"
          echo "  ✓ GitHub release created"
          echo "  ✓ Plugin zip deployed to apt server"
          echo "  ✓ metadata.json validated"
          echo ""
