name: Deploy MXR to Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD" != "dev" ]]; then
            echo "::error::Must run from dev branch. Current: $HEAD"
            exit 1
          fi

  promote:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: test
          fetch-depth: 0

      - name: Merge dev into test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/dev --no-edit

      - name: Push test
        run: git push origin test

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep -oP "Version:\s*\K[0-9.]+" mxroute-mailer.php | head -1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          mkdir -p /tmp/build/mxroute-mailer
          cp -r . /tmp/build/mxroute-mailer/
          rm -rf /tmp/build/mxroute-mailer/.git \
                 /tmp/build/mxroute-mailer/tests \
                 /tmp/build/mxroute-mailer/vendor \
                 /tmp/build/mxroute-mailer/.github \
                 /tmp/build/mxroute-mailer/wiki \
                 /tmp/build/mxroute-mailer/PROMOTION.md \
                 /tmp/build/mxroute-mailer/AGENTS.md \
                 /tmp/build/mxroute-mailer/.gitignore \
                 /tmp/build/mxroute-mailer/composer.* \
                 /tmp/build/mxroute-mailer/phpunit.xml \
                 /tmp/build/mxroute-mailer/phpcs.xml.dist \
                 /tmp/build/mxroute-mailer/.phpunit.result.cache \
                 /tmp/build/mxroute-mailer/*.zip
          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/mxroute-mailer-latest.zip" mxroute-mailer/

      - name: Deploy to apt server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${APT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/mxroute-mailer-test && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/mxroute-mailer-test"

          scp -i ~/.ssh/deploy_key \
            mxroute-mailer-latest.zip \
            "${APT_USER}@${APT_HOST}:/var/www/html/mxroute-mailer-test/mxroute-mailer-latest.zip"

          ssh -i ~/.ssh/deploy_key "${APT_USER}@${APT_HOST}" << METADATA
            cat > /var/www/html/mxroute-mailer-test/metadata.json << 'EOF'
{"version":"${{ steps.version.outputs.version }}","requires":{"php":"7.3","wordpress":"5.0"},"download_url":"https://apt.richardkentgates.com/mxroute-mailer-test/mxroute-mailer-latest.zip"}
EOF
          METADATA

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mxroute-mailer-test-${{ github.run_id }}
          path: mxroute-mailer-latest.zip
          retention-days: 30
